site_name: scikit-route
site_description: Route optimisation (TSP and multi-trip routing) with a scikit-learn flavoured API and a Cython core
site_url: https://arubiales.github.io/scikit-route/
repo_url: https://github.com/arubiales/scikit-route
repo_name: arubiales/scikit-route
edit_uri: edit/main/docs/
not_in_nav: |
  user_guide/_capability_table.md
copyright: Copyright &copy; 2020-2026 Alberto Rubiales. MIT License.

theme:
  name: material
  logo: images/logo.png
  favicon: images/logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow

nav:
  - Home: index.md
  - Getting started: getting_started.md
  - Installation: installation.md
  - User guide:
      - The problem model: user_guide/problem_model.md
      - Choosing a solver: user_guide/choosing_a_solver.md
      - Multi-trip routing: user_guide/multi_trip.md
      - Real inputs from map services: user_guide/real_inputs.md
      - Warm starts and ensembles: user_guide/warm_starts_and_ensembles.md
      - Live visualisation: user_guide/visualisation.md
  - API reference:
      - Base and problem: api/base.md
      - Exact solvers: api/exact.md
      - Construction heuristics: api/construction.md
      - Local search: api/local_search.md
      - Simulated annealing: api/simulated_annealing.md
      - Tabu search: api/tabu_search.md
      - Genetic algorithm: api/genetic.md
      - Ant colony: api/ant_colony.md
      - Self-organising map: api/som.md
      - Ensembles: api/ensemble.md
      - Datasets: api/datasets.md
      - Preprocessing: api/preprocessing.md
      - Utilities: api/utils.md
      - Visualisation: api/viz.md
  - Benchmarks: benchmarks.md
  - Migration from 1.0: migration.md
  - Contributing:
      - How to contribute: contributing.md
      - Design specification: development/specification.md
  - Changelog: changelog.md
  - About: about.md

plugins:
  - search
  - gen-files:
      scripts:
        - docs/gen_pages.py
  - include-markdown
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
            docstring_section_style: table
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/arubiales/scikit-route
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/scikit-route/
