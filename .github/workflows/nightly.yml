name: Nightly benchmarks

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slow-tests:
    name: Slow tests and benchmark table (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Slow tests
        run: pytest tests -m slow -q --junitxml=slow-${{ matrix.os }}.xml
      - name: Live map services (OSRM, Nominatim, Overpass; D33)
        run: pytest tests -m network -q
        continue-on-error: true  # public servers: outages and rate limits must not fail the nightly
      - name: Benchmark table
        run: python benchmarks/waterloo.py --out benchmarks-${{ matrix.os }}.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-${{ matrix.os }}
          path: |
            slow-${{ matrix.os }}.xml
            benchmarks-${{ matrix.os }}.md
