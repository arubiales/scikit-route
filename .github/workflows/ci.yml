name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (format)
        run: ruff format --check .
      - name: Cython lint
        run: cython-lint skroute
      - name: Mypy
        run: mypy skroute

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (builds the Cython extensions)
        run: python -m pip install -e ".[test]" pytest-github-actions-annotate-failures
      - name: Test
        run: pytest tests --cov=skroute --cov-report=xml --cov-report=term
      - name: Doctests (docstring examples must run)
        if: matrix.os == 'ubuntu-latest'
        run: pytest --doctest-modules skroute -q -p no:cacheprovider
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  test-prerelease:
    name: Test (ubuntu, py3.15 pre-release, allowed to fail)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          allow-prereleases: true
      - name: Install
        run: python -m pip install -e ".[test]" pytest-github-actions-annotate-failures
      - name: Test
        run: pytest tests

  sdist:
    name: Source distribution installs and works
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist
        run: |
          python -m pip install build
          python -m build --sdist
      - name: Install the sdist in a fresh environment and smoke-test it
        run: |
          python -m venv /tmp/sdist-venv
          SDIST=$(ls dist/*.tar.gz)
          /tmp/sdist-venv/bin/python -m pip install "scikit-route[test] @ file://$PWD/$SDIST" pytest-github-actions-annotate-failures
          # leave the checkout: from the workspace root ``import skroute`` would pick up the source tree
          cd /tmp
          /tmp/sdist-venv/bin/python -c "import skroute, sys; assert 'site-packages' in skroute.__file__, skroute.__file__; print(skroute.__version__); skroute.IteratedLocalSearch"
          SKROUTE_EXPECT_WHEEL=1 /tmp/sdist-venv/bin/pytest "$GITHUB_WORKSPACE/tests" -x -q -p no:cacheprovider
