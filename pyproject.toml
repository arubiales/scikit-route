[build-system]
requires = ["setuptools>=77", "Cython>=3.1"]
build-backend = "setuptools.build_meta"

[project]
name = "scikit-route"
dynamic = ["version"]
description = "Route optimisation (TSP and multi-trip routing) with a scikit-learn flavoured API and a Cython core"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Alberto Rubiales", email = "al.rubiales.b@gmail.com" }]
maintainers = [{ name = "Alberto Rubiales", email = "al.rubiales.b@gmail.com" }]
keywords = [
  "tsp", "travelling salesman", "vehicle routing", "vrp", "route optimisation",
  "metaheuristics", "simulated annealing", "genetic algorithm", "tabu search",
  "local search", "2-opt", "or-opt", "operations research", "scikit-learn",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Cython",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "joblib>=1.3",
]

[project.optional-dependencies]
pandas = ["pandas>=2.2"]
google = ["googlemaps>=4.10"]
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "pandas>=2.2",
]
dev = [
  "scikit-route[test]",
  "ruff>=0.6",
  "mypy>=1.10",
  "cython-lint>=0.16",
  "pre-commit>=3.7",
  "build>=1.2",
  "cibuildwheel>=3.0",
  "Cython>=3.1",
]
docs = [
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25",
  "mkdocs-gen-files>=0.5",
  "mkdocs-include-markdown-plugin>=6.0",
]

[project.urls]
Homepage = "https://github.com/arubiales/scikit-route"
Documentation = "https://arubiales.github.io/scikit-route/"
Repository = "https://github.com/arubiales/scikit-route"
Issues = "https://github.com/arubiales/scikit-route/issues"
Changelog = "https://github.com/arubiales/scikit-route/blob/main/CHANGELOG.md"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "skroute._version.__version__" }

[tool.setuptools.packages.find]
include = ["skroute*"]
exclude = ["tests*", "benchmarks*", "docs*"]

[tool.setuptools.package-data]
"skroute" = ["py.typed", "**/*.pyi", "**/*.pxd"]
"skroute.datasets" = ["_data/tsplib/*.tsp", "_data/costs/*.csv", "_descr/*.md"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-m 'not slow' --strict-markers -ra"
doctest_optionflags = "NORMALIZE_WHITESPACE ELLIPSIS NUMBER"
markers = [
  "slow: Waterloo instances with n >= 194, MILP on qa194, anything above 10 s (deselected by default)",
  "benchmark: alias marker on the slow benchmark tests, for tooling",
]
filterwarnings = ["error::DeprecationWarning:skroute.*"]

[tool.coverage.run]
source = ["skroute"]
omit = ["skroute/preprocessing/google.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["build", "dist", "site", ".venv*", "docs/development"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY", "RUF", "SIM", "PIE", "PERF"]
ignore = ["RUF012", "B028", "SIM108", "PERF203"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "NPY002", "RUF005"]
"benchmarks/**" = ["NPY002"]
"docs/**" = ["E402", "F401"]

[tool.ruff.lint.isort]
known-first-party = ["skroute"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
packages = ["skroute"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["build/", "tests/", "docs/"]

[tool.cython-lint]
max-line-length = 110

[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_* pp*"
build-verbosity = 1
test-requires = ["pytest>=8.0", "hypothesis>=6.100", "pandas>=2.2"]
test-command = "pytest {project}/tests -x -q"
test-environment = { SKROUTE_EXPECT_WHEEL = "1" }

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]
